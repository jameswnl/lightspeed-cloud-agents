# Workflow runner for local executor (no Temporal)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-runner
  labels:
    app: workflow-runner
    environment: cloud-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-runner
  template:
    metadata:
      labels:
        app: workflow-runner
        environment: cloud-agents
    spec:
      serviceAccountName: workflow-runner
      containers:
        - name: workflow-runner
          image: localhost/workflow-runner:latest
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn", "cloud_agents.entrypoint:app", "--host", "0.0.0.0", "--port", "8080"]
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
          env:
            - name: WORKFLOW_ENGINE
              value: "local"
            - name: WORKFLOW_SPAWNER
              value: "kubernetes"
            - name: SPAWNER_NAMESPACE
              value: "default"
            - name: SPAWNER_SERVICE_ACCOUNT
              value: "workflow-runner"
            - name: AUTH_REQUIRED
              value: "false"
            - name: RUN_STATE_DB_URL
              value: "postgresql://workflow:workflow-pass@postgres:5432/temporal"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: OPENAI_API_KEY
                  optional: true
          volumeMounts:
            - name: tmp-scratch
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp-scratch
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-runner
  labels:
    app: workflow-runner
    environment: cloud-agents
spec:
  selector:
    app: workflow-runner
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
