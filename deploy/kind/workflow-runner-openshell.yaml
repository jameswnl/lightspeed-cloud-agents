# Workflow runner configured for OpenShell spawner.
#
# OPENSHELL_GATEWAY_URL below is a placeholder -- this manifest does not
# deploy an OpenShell gateway itself (that's a separate concern, issue
# #198: OpenShellSpawner is the only ephemeral spawner, but where/how the
# gateway runs is invisible to workflow-runner beyond this URL). Replace
# the placeholder with your own, separately-deployed gateway's address
# before applying. See docs/testing-against-openshell-gateways.md for
# setting one up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-runner
  labels:
    app: workflow-runner
    environment: cloud-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-runner
  template:
    metadata:
      labels:
        app: workflow-runner
        environment: cloud-agents
    spec:
      serviceAccountName: workflow-runner
      containers:
        - name: workflow-runner
          image: localhost/workflow-runner:latest
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn", "cloud_agents.workflow.executor.temporal.entrypoint:app", "--host", "0.0.0.0", "--port", "8080"]
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
          env:
            - name: TEMPORAL_URL
              value: "temporal:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: WORKFLOW_SPAWNER
              value: "openshell"
            - name: OPENSHELL_GATEWAY_URL
              value: "CHANGEME.example.com:17670"  # your OpenShell gateway address
            - name: AUTH_REQUIRED
              value: "false"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-api-key
                  key: OPENAI_API_KEY
                  optional: true
          volumeMounts:
            - name: tmp-scratch
              mountPath: /tmp
            - name: sa-token
              mountPath: /var/run/secrets/cloud-agents
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp-scratch
          emptyDir:
            medium: Memory
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: cloud-agents
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-runner
  labels:
    app: workflow-runner
    environment: cloud-agents
spec:
  selector:
    app: workflow-runner
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
