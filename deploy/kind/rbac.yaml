# ServiceAccounts and RBAC for cloud agents
# Each agent type gets a scoped ServiceAccount.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnostic-agent
  labels:
    app: diagnostic-agent
    environment: cloud-agents
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring-agent
  labels:
    app: monitoring-agent
    environment: cloud-agents
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-runner
  labels:
    app: workflow-runner
    environment: cloud-agents
---
# Note: workflow-runner no longer needs direct Jobs/pods/services permissions --
# OpenShellSpawner is the only ephemeral spawner (issue #198) and talks to the
# OpenShell gateway over gRPC; the gateway's own compute driver (not
# workflow-runner) is what touches the Kubernetes API to spawn sandboxes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workflow-runner-tokenreview
  labels:
    environment: cloud-agents
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workflow-runner-tokenreview-binding
  labels:
    environment: cloud-agents
subjects:
  - kind: ServiceAccount
    name: workflow-runner
    namespace: default
roleRef:
  kind: ClusterRole
  name: workflow-runner-tokenreview
  apiGroup: rbac.authorization.k8s.io
