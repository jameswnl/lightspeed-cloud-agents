# Cloud Agents — local executor stack (no Temporal).
#
# Usage:
#   export OPENAI_API_KEY="sk-..."
#   export OPENSHELL_GATEWAY_URL="<host>:<port>"  # your own, separately-deployed OpenShell gateway
#   podman compose -f deploy/podman/docker-compose.local.yaml up -d
#   podman compose -f deploy/podman/docker-compose.local.yaml down
#
# Workflow runner API: http://localhost:8080
#
# This stack does not deploy an OpenShell gateway -- that's a separate
# concern (issue #198: OpenShellSpawner is the only ephemeral spawner, but
# where/how the gateway itself runs is invisible to workflow-runner beyond
# OPENSHELL_GATEWAY_URL). See docs/testing-against-openshell-gateways.md
# for setting one up. If the gateway runs on the host itself (not another
# container), OPENSHELL_GATEWAY_URL needs a container-reachable host from
# workflow-runner's perspective (e.g. host.containers.internal:<port>),
# not localhost.

services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow-pass
      POSTGRES_DB: cloud_agents
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  workflow-runner:
    image: localhost/workflow-runner:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WORKFLOW_ENGINE: local
      WORKFLOW_SPAWNER: openshell
      OPENSHELL_GATEWAY_URL: ${OPENSHELL_GATEWAY_URL:?set to your separately-deployed OpenShell gateway address}
      AUTH_REQUIRED: "false"
      RUN_STATE_DB_URL: postgresql://workflow:workflow-pass@postgres:5432/cloud_agents
      TRANSCRIPT_DB_URL: postgresql://workflow:workflow-pass@postgres:5432/cloud_agents
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
