# Cloud Agents — local executor stack (no Temporal).
#
# Usage:
#   export OPENAI_API_KEY="sk-..."
#   podman compose -f deploy/podman/docker-compose.local.yaml up -d
#   podman compose -f deploy/podman/docker-compose.local.yaml down
#
# Workflow runner API: http://localhost:8080

services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow-pass
      POSTGRES_DB: cloud_agents
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  openshell-gateway:
    image: ghcr.io/nvidia/openshell/gateway:latest
    restart: unless-stopped
    # Required for Podman socket access (DooD pattern -- the gateway spawns
    # sibling sandbox containers via the host Podman socket). Now the only
    # thing in this stack that needs it, since OpenShellSpawner talks to
    # the gateway over gRPC instead of the socket directly (issue #198).
    user: "0"
    ports:
      - "127.0.0.1:17670:8080"
      - "127.0.0.1:17671:8081"
    volumes:
      - ${PODMAN_SOCK}:/run/podman/podman.sock
      - openshell-data:/var/lib/openshell
      - ../openshell/gateway.toml:/etc/openshell/gateway.toml:ro
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DB_URL: "sqlite:/var/lib/openshell/gateway.db?mode=rwc"
      XDG_DATA_HOME: /var/lib/openshell
      HOME: /var/lib/openshell

  workflow-runner:
    image: localhost/workflow-runner:latest
    depends_on:
      postgres:
        condition: service_healthy
      openshell-gateway:
        condition: service_started
    environment:
      WORKFLOW_ENGINE: local
      WORKFLOW_SPAWNER: openshell
      OPENSHELL_GATEWAY_URL: openshell-gateway:8080
      AUTH_REQUIRED: "false"
      RUN_STATE_DB_URL: postgresql://workflow:workflow-pass@postgres:5432/cloud_agents
      TRANSCRIPT_DB_URL: postgresql://workflow:workflow-pass@postgres:5432/cloud_agents
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  openshell-data:
