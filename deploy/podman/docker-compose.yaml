# Cloud Agents platform — core stack.
#
# Usage:
#   export OPENAI_API_KEY="sk-..."
#   export OPENSHELL_GATEWAY_URL="<host>:<port>"  # your own, separately-deployed OpenShell gateway
#   podman compose -f deploy/podman/docker-compose.yaml up -d
#   podman compose -f deploy/podman/docker-compose.yaml down
#
# Workflow runner API: http://localhost:8080
# Temporal UI:        http://localhost:8233
# Temporal gRPC:      localhost:7233
#
# This stack does not deploy an OpenShell gateway -- that's a separate
# concern (issue #198: OpenShellSpawner is the only ephemeral spawner, but
# where/how the gateway itself runs is invisible to workflow-runner beyond
# OPENSHELL_GATEWAY_URL). See docs/testing-against-openshell-gateways.md
# for setting one up.

services:
  temporal-db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal-server:
    image: docker.io/temporalio/auto-setup:latest
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    ports:
      - "7233:7233"

  temporal-ui:
    image: docker.io/temporalio/ui:latest
    depends_on:
      - temporal-server
    environment:
      TEMPORAL_ADDRESS: temporal-server:7233
    ports:
      - "8233:8080"

  workflow-runner:
    image: localhost/workflow-runner:latest
    depends_on:
      - temporal-server
    environment:
      TEMPORAL_URL: temporal-server:7233
      TEMPORAL_NAMESPACE: default
      WORKFLOW_SPAWNER: openshell
      OPENSHELL_GATEWAY_URL: ${OPENSHELL_GATEWAY_URL:?set to your separately-deployed OpenShell gateway address}
      AUTH_REQUIRED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRANSCRIPT_DB_URL: postgresql://temporal:temporal@temporal-db:5432/temporal
      TRANSCRIPT_RETENTION_DAYS: ${TRANSCRIPT_RETENTION_DAYS:-30}
    ports:
      - "8080:8080"

volumes:
  temporal-db-data:
