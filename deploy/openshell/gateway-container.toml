[openshell]
version = 1

[openshell.gateway]
bind_address        = "0.0.0.0:17670"
health_bind_address = "0.0.0.0:17671"
log_level           = "info"
compute_drivers     = ["podman"]
disable_tls         = true
enable_loopback_service_http = true

[openshell.gateway.auth]
allow_unauthenticated_users = true

[openshell.gateway.gateway_jwt]
signing_key_path = "/etc/openshell/jwt-private.pem"
public_key_path  = "/etc/openshell/jwt-public.pem"
kid_path         = "/etc/openshell/jwt-kid.txt"

[openshell.drivers.podman]
socket_path       = "/run/user/501/podman/podman.sock"
default_image     = "lightspeed-agentic-sandbox:latest"
supervisor_image  = "ghcr.io/nvidia/openshell/supervisor:latest"
image_pull_policy = "missing"
grpc_endpoint     = "http://openshell-gw:17670"
