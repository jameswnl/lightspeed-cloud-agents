workflowRunner:
  image:
    repository: quay.io/openshift-lightspeed/workflow-runner
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount:
    create: true
    name: workflow-runner

temporal:
  url: "temporal:7233"
  namespace: "default"
  tls:
    enabled: false
    certPath: ""
    keyPath: ""
    caPath: ""

auth:
  required: false

# openshell is the only supported ephemeral spawner (issue #198). The
# gateway itself must be deployed separately -- deploying and operating it
# is out of scope for this repo, and its own compute driver config
# (kubernetes for K8s/OCP, podman for Podman) is invisible to
# workflowRunner/spawner values here. See
# docs/testing-against-openshell-gateways.md for setting one up.
spawner:
  type: "openshell"
  gatewayUrl: "CHANGEME.example.com:17670"  # your OpenShell gateway address
  workspace: "default"

sandboxImage: "quay.io/openshift-lightspeed/lightspeed-agentic-sandbox:latest"

networkPolicy:
  enabled: true
  egress:
    enabled: true
    llmCidrs: []

securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

rbac:
  create: true

prometheusRule:
  enabled: false

transcriptStore:
  # PostgreSQL URL for full transcript persistence.
  # When empty, transcripts are only stored in Temporal workflow query state (truncated).
  # Default: reuse Temporal's PostgreSQL instance.
  dbUrl: ""
  retentionDays: 30

podDisruptionBudget:
  enabled: true
  minAvailable: 1
