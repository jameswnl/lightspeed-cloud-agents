{{- if .Values.rbac.create }}
# workflow-runner no longer needs direct Jobs/pods/services permissions --
# OpenShellSpawner is the only ephemeral spawner (issue #198) and talks to
# the OpenShell gateway over gRPC; the gateway's own compute driver (not
# workflow-runner) is what touches the Kubernetes API to spawn sandboxes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workflowRunner.serviceAccount.name }}
  labels:
    app: workflow-runner
    chart: {{ .Chart.Name }}
{{- end }}
