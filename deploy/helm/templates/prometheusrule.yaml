{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  labels:
    app: workflow-runner
spec:
  groups:
    - name: cloud-agents
      rules:
        - alert: WorkflowStepFailureRateHigh
          expr: rate(ls_workflow_step_runs_total{status="failed"}[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Workflow step failure rate above 10%"

        - alert: SandboxCleanupFailure
          expr: increase(ls_sandbox_cleanup_failures_total[10m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Sandbox container cleanup failed — possible container leak"

        - alert: SandboxOrphanDetected
          expr: increase(ls_sandbox_orphans_cleaned_total[10m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Expired orphaned sandboxes reaped (startup or periodic reconcile) — possible prior crash"

        - alert: SandboxReapFailure
          expr: increase(ls_sandbox_reap_failures_total[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Orphaned sandbox reconcile keeps failing to list or delete — expired sandboxes may accumulate"

        - alert: WorkflowRunnerDown
          expr: up{job="workflow-runner"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Workflow runner is down"
        # WorkflowRunnerNotReady: deferred — needs explicit Temporal connectivity metric (TODO T2 heartbeat)
        # CircuitBreakerOpen: deferred — needs dedicated breaker state metric (TODO expose from ProviderCircuitBreaker)
{{- end }}
